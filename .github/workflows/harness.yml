# Harness image workflow (spec §6.4). Builds the adapter image for one harness
# from one commit of main (the build commit), on the task base that commit's
# task-base.json pins (spec §6.5), in a job that cannot push or attest. Then
# checks the image against the build commit's files and the task base,
# publishes it to GHCR with a build-provenance attestation, and uploads
# harness-pins.json for the maintainer, who then adds the registry entry in a
# pull request:
#
#   gh run download <run id> --name harness-pins-<id>
#   git switch --create register-<id> origin/main
#   python3 scripts/harness.py pin harness-pins.json
#   python3 scripts/harness.py verify <id>
#   git add registry.json && git commit --message "Register <id> <version>"
#
# The registry entry is computed from the build commit's adapter files, so the
# pull request shows exactly what the image was built from.
name: harness

on:
  workflow_dispatch:
    inputs:
      harness:
        description: Harness id (a directory under harnesses/)
        required: true
        type: string

permissions: {}

concurrency:
  group: harness-${{ inputs.harness }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash  # bash -eo pipefail: a failing command in a pipeline fails the step

jobs:
  check:
    # Validating harness.json against its schema needs packages from PyPI, so it
    # runs here, with no write permission; the image job takes nothing from it.
    if: github.repository == 'SigorMatt/harness-bench' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install "jsonschema>=4.18" "referencing>=0.30"
      - name: Check the adapter
        env:
          HARNESS: ${{ inputs.harness }}  # passed as data, never interpolated into the script
        run: python3 scripts/harness.py inputs --harness "$HARNESS"

  build:
    # An adapter's build installs its harness (npm, pip, apt), so it runs here,
    # with no write permission. The image job only loads, checks, pushes and
    # attests what this job built; it builds nothing itself.
    needs: check
    if: github.repository == 'SigorMatt/harness-bench' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      image_id: ${{ steps.build.outputs.image_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the image
        id: names
        env:
          HARNESS: ${{ inputs.harness }}
        run: python3 scripts/harness.py names --harness "$HARNESS" --build-sha "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build the image
        id: build
        env:
          HARNESS: ${{ inputs.harness }}
          ADAPTER: ${{ steps.names.outputs.dir }}
          IMAGE: ${{ steps.names.outputs.image }}
          TAG: ${{ steps.names.outputs.tag }}
          VERSION: ${{ steps.names.outputs.version }}
          TASK_BASE: ${{ steps.names.outputs.task_base }}
        run: |
          # The adapter directory is the build context; its Dockerfile pins what it installs and
          # starts FROM the task base it is given. The label names the harness, which
          # scripts/harness.py checks on every image it verifies.
          docker build --provenance=false --file "$ADAPTER/Dockerfile" --build-arg "TASK_BASE=$TASK_BASE" \
            --label "io.github.sigormatt.harness-bench.harness=$HARNESS" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$IMAGE:$TAG" "$ADAPTER"
          docker save --output "$RUNNER_TEMP/image.tar" "$IMAGE:$TAG"
          echo "image_id=$(docker image inspect --format '{{.Id}}' "$IMAGE:$TAG")" >> "$GITHUB_OUTPUT"

      - name: Upload the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-image
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 7  # long enough to re-run a failed job of the same run

  image:
    # Only from main of this repository, so the provenance names refs/heads/main,
    # which scripts/harness.py verify requires.
    needs: build
    if: github.repository == 'SigorMatt/harness-bench' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write      # push the image to GHCR
      id-token: write      # signing identity for the attestation
      attestations: write  # store the attestation
    env:
      PYTHONDONTWRITEBYTECODE: "1"  # nothing written into the checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the image
        id: names
        env:
          HARNESS: ${{ inputs.harness }}
        run: |
          # The runner's own python3, and only the standard library (hb/harness.py).
          python3 scripts/harness.py names --harness "$HARNESS" --build-sha "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Download the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: harness-image
          path: ${{ runner.temp }}/image

      - name: Load and check the image
        env:
          HARNESS: ${{ inputs.harness }}
          IMAGE: ${{ steps.names.outputs.image }}
          TAG: ${{ steps.names.outputs.tag }}
          BUILT_ID: ${{ needs.build.outputs.image_id }}
          TASK_BASE: ${{ steps.names.outputs.task_base }}
        run: |
          docker load --quiet --input "$RUNNER_TEMP/image/image.tar"
          loaded=$(docker image inspect --format '{{.Id}}' "$IMAGE:$TAG")
          if [ "$loaded" != "$BUILT_ID" ]; then echo "::error::loaded $loaded, built $BUILT_ID"; exit 1; fi
          # The task base, pulled here by digest with an empty Docker configuration: anonymously, so only
          # a public image can be pulled, whatever credentials the runner has.
          DOCKER_CONFIG="$(mktemp -d)" docker pull --quiet "$TASK_BASE" > /dev/null
          docker image inspect "$TASK_BASE" > "$RUNNER_TEMP/base-inspect.json"
          # Its /hb/config is the build commit's config/, the entrypoint's /hb files are there,
          # it is labelled with the harness id, it has no ENTRYPOINT of its own, and its first
          # layers are the task base's.
          docker image inspect "$IMAGE:$TAG" > "$RUNNER_TEMP/inspect.json"
          cid=$(docker create "$IMAGE:$TAG" /hb-never-run)
          docker cp --follow-link "$cid:/hb" "$RUNNER_TEMP/hb"  # a symlink at /hb resolves inside the image
          docker rm "$cid"
          python3 scripts/harness.py check-image --harness "$HARNESS" --copied "$RUNNER_TEMP/hb" \
            --inspect "$RUNNER_TEMP/inspect.json" --base-inspect "$RUNNER_TEMP/base-inspect.json"

      - name: Push the image
        id: push
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          TAG: ${{ steps.names.outputs.tag }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push --quiet "$IMAGE:$TAG"
          # The digest the push recorded for this repository: exactly one.
          ref=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:$TAG" \
                | grep -x "$IMAGE@sha256:[0-9a-f]\{64\}" || true)
          if [ "$(printf '%s' "$ref" | grep -c .)" -ne 1 ]; then
            echo "::error::expected one digest for $IMAGE, got: $ref"; exit 1
          fi
          docker pull --quiet "$ref" > /dev/null  # the registry serves exactly this digest
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"

      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Write the harness pins
        env:
          HARNESS: ${{ inputs.harness }}
          REF: ${{ steps.push.outputs.ref }}
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          python3 scripts/harness.py pins --harness "$HARNESS" --build-sha "$GITHUB_SHA" --image "$REF" \
            --out "$RUNNER_TEMP/harness-pins.json"
          {
            echo "### $HARNESS $VERSION: image built from $GITHUB_SHA"
            echo '```json'
            cat "$RUNNER_TEMP/harness-pins.json"
            echo '```'
            echo "Next, in a full, clean clone with the gh CLI logged in (spec §6.4). The first image of a new"
            echo "harness lands in a private GHCR package: make it public first, or verify cannot pull it."
            echo '```'
            echo "gh run download $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY --name harness-pins-$HARNESS"
            echo "git switch --create register-$HARNESS origin/main"
            echo "python3 scripts/harness.py pin harness-pins.json"
            echo "python3 scripts/harness.py verify $HARNESS"
            echo "git add registry.json && git commit --message 'Register $HARNESS $VERSION'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the harness pins
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-pins-${{ inputs.harness }}
          path: ${{ runner.temp }}/harness-pins.json
          if-no-files-found: error
