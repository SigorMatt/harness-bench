name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install "jsonschema>=4.18" "referencing>=0.30" "pytest>=8"
      - run: python -m pytest -q
      - run: python scripts/make_examples.py --check
      # The toolkit image's Python is 3.12, so the tests run on it too (tarfile behaves
      # differently across 3.12 releases). Same job, so the required check keeps its name.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.18" "referencing>=0.30" "pytest>=8"
      - run: python -m pytest -q

  lint-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install actionlint-py shellcheck-py
      - run: actionlint .github/workflows/*.yml templates/*.yml

  # End-to-end run-task tests against the runner's Docker daemon: the toolkit
  # image built from docker/, a stub harness and a stub provider. Not a required
  # check yet.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install "jsonschema>=4.18" "referencing>=0.30" "pytest>=8"
      - name: Build the toolkit base image
        run: docker build --quiet --file docker/toolkit-base.Dockerfile --tag hb-ci/toolkit-base:latest docker
      - name: Run the Docker end-to-end tests
        env:
          HB_DOCKER_TESTS: "1"
          HB_TEST_BASE_IMAGE: hb-ci/toolkit-base:latest
          HB_TEST_HARNESS_BASE: python:3.12-slim-bookworm
        run: python -m pytest -q tests/test_run_task_docker.py
