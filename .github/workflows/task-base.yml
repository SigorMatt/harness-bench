# Task base workflow (spec §6.5). Builds the task base, the image every harness
# image starts from, from one commit of main (the build commit) in a job that
# cannot push or attest, and tries it the way a harness container runs. The job
# that can push and attest builds nothing: it loads the image, checks it is the
# one built, publishes it to GHCR with a build-provenance attestation and
# uploads task-base-pins.json for the maintainer, who then pins it in
# task-base.json in a pull request:
#
#   gh run download <run id> --name task-base-pins
#   git switch --create pin-task-base origin/main
#   python3 scripts/task_base.py pin task-base-pins.json
#   python3 scripts/task_base.py verify
#   git add task-base.json && git commit --message "Pin the task base built from <sha>"
#
# The first image lands in a private GHCR package: make it public first, or
# verify cannot pull it.
name: task-base

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: task-base
  cancel-in-progress: false

defaults:
  run:
    shell: bash  # bash -eo pipefail: a failing command in a pipeline fails the step

jobs:
  build:
    # The build installs git from Debian's archive and pytest from PyPI, so it
    # runs here, with no write permission.
    if: github.repository == 'SigorMatt/harness-bench' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"  # nothing written into the checkout
    outputs:
      image_id: ${{ steps.build.outputs.image_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the image
        id: names
        run: python3 scripts/task_base.py names --build-sha "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build the image
        id: build
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          TAG: ${{ steps.names.outputs.tag }}
        run: |
          # The Python base image is pinned by digest and every wheel by hash in docker/.
          docker build --provenance=false --file docker/task-base.Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$TAG" docker
          echo "image_id=$(docker image inspect --format '{{.Id}}' "$IMAGE:$TAG")" >> "$GITHUB_OUTPUT"

      - name: Try the image as a harness container runs
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          TAG: ${{ steps.names.outputs.tag }}
        run: |
          # The harness container's user, read-only root, /tmp and HOME (spec §6), and no network;
          # tests/test_task_base.py checks these flags against hb/profile.py.
          profile=(--rm --network none --read-only --tmpfs "/tmp:rw,nosuid,nodev" --user 10001:10001
                   --cap-drop ALL --security-opt no-new-privileges --env HOME=/tmp --workdir /tmp)
          docker run "${profile[@]}" "$IMAGE:$TAG" python3 -m pytest --version
          # What agents do: run a test, look up their user, commit with git.
          docker run "${profile[@]}" "$IMAGE:$TAG" sh -c 'printf "def test_it():\n    assert 1 + 1 == 2\n" > test_it.py && python3 -m pytest -q test_it.py'
          docker run "${profile[@]}" "$IMAGE:$TAG" sh -c 'whoami && git init -q repo && git -C repo commit -q --allow-empty -m first && git -C repo log --format=%an'
          docker run "${profile[@]}" "$IMAGE:$TAG" git --version

      - name: Save the image
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          TAG: ${{ steps.names.outputs.tag }}
        run: docker save --output "$RUNNER_TEMP/image.tar" "$IMAGE:$TAG"

      - name: Upload the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task-base-image
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 7  # long enough to re-run a failed job of the same run

  image:
    # Only from main of this repository, so the provenance names refs/heads/main,
    # which scripts/task_base.py verify requires.
    needs: build
    if: github.repository == 'SigorMatt/harness-bench' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write      # push the image to GHCR
      id-token: write      # signing identity for the attestation
      attestations: write  # store the attestation
    env:
      PYTHONDONTWRITEBYTECODE: "1"  # nothing written into the checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the image
        id: names
        run: |
          # The runner's own python3, and only the standard library (hb/taskbase.py).
          python3 scripts/task_base.py names --build-sha "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Download the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: task-base-image
          path: ${{ runner.temp }}/image

      - name: Load the image
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          TAG: ${{ steps.names.outputs.tag }}
          BUILT_ID: ${{ needs.build.outputs.image_id }}
        run: |
          docker load --quiet --input "$RUNNER_TEMP/image/image.tar"
          loaded=$(docker image inspect --format '{{.Id}}' "$IMAGE:$TAG")
          if [ "$loaded" != "$BUILT_ID" ]; then echo "::error::loaded $loaded, built $BUILT_ID"; exit 1; fi

      - name: Push the image
        id: push
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          TAG: ${{ steps.names.outputs.tag }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push --quiet "$IMAGE:$TAG"
          # The digest the push recorded for this repository: exactly one.
          ref=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:$TAG" \
                | grep -x "$IMAGE@sha256:[0-9a-f]\{64\}" || true)
          if [ "$(printf '%s' "$ref" | grep -c .)" -ne 1 ]; then
            echo "::error::expected one digest for $IMAGE, got: $ref"; exit 1
          fi
          docker pull --quiet "$ref" > /dev/null  # the registry serves exactly this digest
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"

      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Write the task base pins
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: |
          python3 scripts/task_base.py pins --build-sha "$GITHUB_SHA" --image "$REF" \
            --out "$RUNNER_TEMP/task-base-pins.json"
          {
            echo "### Task base built from $GITHUB_SHA"
            echo '```json'
            cat "$RUNNER_TEMP/task-base-pins.json"
            echo '```'
            echo "Next, in a full, clean clone with the gh CLI logged in (spec §6.5). The first image lands in a"
            echo "private GHCR package: make it public first, or verify cannot pull it."
            echo '```'
            echo "gh run download $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY --name task-base-pins"
            echo "git switch --create pin-task-base origin/main"
            echo "python3 scripts/task_base.py pin task-base-pins.json"
            echo "python3 scripts/task_base.py verify"
            echo "git add task-base.json && git commit --message 'Pin the task base built from ${GITHUB_SHA:0:12}'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the task base pins
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task-base-pins
          path: ${{ runner.temp }}/task-base-pins.json
          if-no-files-found: error
