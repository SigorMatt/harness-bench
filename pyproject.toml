[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessbench"
version = "0.1.0"
description = "Reference library for the harnessbench result-bundle protocol"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.18", "referencing>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hb-gateway = "hb.gateway:main"

[tool.setuptools]
packages = ["hb"]  # schemas/ is read from the repository checkout (editable install)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
